rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: |
      Configuration only defines a printer topic namespace. The bridge can come online later,
      so there is no meaningful connectivity probe during entry creation.
  test-before-setup:
    status: exempt
    comment: |
      Setup intentionally succeeds before the bridge is online so printers can appear later via MQTT.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: |
      This integration is passive and MQTT-push based. It does not maintain its own availability probe.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      The integration has no authentication flow.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: |
      MQTT discovery only publishes the printer identifier; there is no mutable host metadata to refresh.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Each config entry represents exactly one printer device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      Removing the config entry removes the corresponding single printer device.

  # Platinum
  async-dependency: todo
  inject-websession: done
  strict-typing: todo
