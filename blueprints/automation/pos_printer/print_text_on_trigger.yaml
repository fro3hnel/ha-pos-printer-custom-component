blueprint:
  name: Print text on any trigger
  description: >-
    Print a fixed or templated message whenever user-selected Home Assistant
    triggers fire and optional conditions pass.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    automation_triggers:
      name: Triggers
      description: Choose one or more triggers for the printout.
      selector:
        trigger:
    automation_conditions:
      name: Optional conditions
      description: All selected conditions must pass before printing.
      default: []
      selector:
        condition:
    printer_config_entry:
      name: Printer
      selector:
        config_entry:
          integration: pos_printer
    title:
      name: Optional title
      default: ""
      selector:
        template:
    message:
      name: Message
      description: A fixed text or template rendered when the automation runs.
      selector:
        template:
    footer:
      name: Optional footer
      default: ""
      selector:
        template:
    alignment:
      name: Text alignment
      default: left
      selector:
        select:
          options:
            - left
            - center
            - right
    paper_width:
      name: Paper width
      default: 80
      selector:
        select:
          options:
            - label: 53 mm
              value: 53
            - label: 80 mm
              value: 80
    feed_after:
      name: Feed after
      default: 4
      selector:
        number:
          min: 0
          step: 1

mode: queued
max: 10
max_exceeded: warning

triggers: !input automation_triggers
conditions: !input automation_conditions

actions:
  - action: pos_printer.print_text
    data:
      config_entry_id: !input printer_config_entry
      title: !input title
      text: !input message
      footer: !input footer
      alignment: !input alignment
      paper_width: !input paper_width
      feed_after: !input feed_after
